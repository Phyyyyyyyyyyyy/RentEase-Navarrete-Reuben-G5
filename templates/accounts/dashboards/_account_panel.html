{# Styled with Tailwind CSS utility classes #}
<div class="rounded-2xl border border-line bg-white shadow-sm">
  <div class="flex items-center justify-between border-b border-slate-100 px-6 py-5">
    <div>
      <span class="text-[11px] font-extrabold uppercase tracking-widest text-brand">Your account</span>
      <h2 class="mt-1 text-lg font-bold tracking-tight text-slate-900">Account summary</h2>
    </div>
    <span class="rounded-full bg-emerald-50 px-2.5 py-1 text-[10px] font-bold text-emerald-700">{% if user.is_active %}Active{% else %}Inactive{% endif %}</span>
  </div>
  <dl class="grid grid-cols-1 gap-x-4 gap-y-1 px-6 py-5 text-sm sm:grid-cols-[140px_1fr] sm:gap-y-3">
    <dt class="text-slate-400">Name</dt>
    <dd class="mb-2 font-semibold text-slate-800 sm:mb-0">{{ user.get_full_name|default:"—" }}</dd>
    <dt class="text-slate-400">Email</dt>
    <dd class="mb-2 break-words font-semibold text-slate-800 sm:mb-0">{{ user.email }}</dd>
    <dt class="text-slate-400">Contact number</dt>
    <dd class="mb-2 font-semibold text-slate-800 sm:mb-0">{{ user.phone|default:"—" }}</dd>
    <dt class="text-slate-400">Role</dt>
    <dd class="font-semibold text-slate-800"><span class="rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold text-brand-dark">{{ user.get_role_display }}</span></dd>
  </dl>
  <div class="border-t border-slate-100 px-6 py-4">
    <a href="{% url 'accounts:profile_edit' %}" class="inline-flex items-center gap-2 rounded-lg bg-brand px-4 py-2 text-xs font-bold text-white no-underline shadow-md shadow-blue-600/20 transition hover:-translate-y-px hover:bg-brand-dark">Edit profile</a>
  </div>
</div>
