{# Pinging "needs attention" dot. Usage: {% include "partials/ping_dot.html" with label="3 pending" css="ml-auto" %} #}
<span class="relative flex size-2.5 shrink-0 {{ css }}" title="{{ label }}">
  <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-sky-400 opacity-75"></span>
  <span class="relative inline-flex size-2.5 rounded-full bg-sky-500"></span>
  <span class="sr-only">{{ label }}</span>
</span>
