<label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %}<span class="label-hint">(optional)</span>{% endif %}
  {{ field }}
  {% if field.help_text and show_help %}<small class="field-help">{{ field.help_text|safe }}</small>{% endif %}
  {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
</label>
