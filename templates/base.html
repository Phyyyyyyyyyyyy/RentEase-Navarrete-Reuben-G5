{% load static rentease %}<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/brand/favicon.svg' %}">
  <meta name="color-scheme" content="light dark">
  <script>
    /*
     * Light/dark theme. Runs before the stylesheet so the page never flashes the
     * wrong theme. The choice ("light", "dark", or nothing = follow the device) is
     * kept in localStorage; with no choice it tracks the OS setting live.
     */
    (function () {
      var KEY = 'rentease-theme', root = document.documentElement;
      var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      function pref() {
        try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : 'system'; }
        catch (e) { return 'system'; }
      }
      function apply() {
        var p = pref(), theme = p === 'system' ? (mq && mq.matches ? 'dark' : 'light') : p;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-theme-pref', p);
        var meta = document.querySelector('meta[name=theme-color]');
        if (meta) meta.content = theme === 'dark' ? '#0b1220' : '#2563eb';
      }
      window.rentEaseTheme = {
        get: pref,
        set: function (p) {
          try { if (p === 'system') localStorage.removeItem(KEY); else localStorage.setItem(KEY, p); } catch (e) {}
          apply();
        }
      };
      apply();
      if (mq) { if (mq.addEventListener) mq.addEventListener('change', apply); else mq.addListener(apply); }
      // Keep other open tabs in sync.
      window.addEventListener('storage', function (e) { if (e.key === KEY) apply(); });
    })();
  </script>
  <title>{% block title %}RentEase{% endblock %} · RentEase</title>
  {# Generated by `npm run tw:build` from static_src/ (Tailwind + RentEase styles). Do not edit directly. #}
  <link rel="stylesheet" href="{% versioned_static 'css/main.css' %}">
</head>
<body>
{% block body %}{% endblock %}
<script>
  // Theme toggle buttons: System -> Light -> Dark -> System.
  (function () {
    var NEXT = { system: 'light', light: 'dark', dark: 'system' };
    var LABEL = { system: 'match device', light: 'light', dark: 'dark' };
    function label() {
      var p = window.rentEaseTheme.get();
      document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
        var text = 'Theme: ' + LABEL[p] + ' (switch to ' + LABEL[NEXT[p]] + ')';
        btn.title = text; btn.setAttribute('aria-label', text);
      });
    }
    document.addEventListener('click', function (e) {
      if (!e.target.closest('[data-theme-toggle]')) return;
      window.rentEaseTheme.set(NEXT[window.rentEaseTheme.get()]);
      label();
    });
    window.addEventListener('storage', label);
    label();
  })();
</script>
<script>
  /*
   * Loading state for submit buttons. Add data-loading="Saving…" to a submit
   * button: on submit it is disabled (prevents double submits) and shows a
   * spinner with that text. Skipped if the submit was cancelled (e.g. confirm()).
   */
  (function () {
    var SPINNER =
      '<svg class="size-4 shrink-0 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>' +
      '<path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>';
    var LOADING_CLASSES = ['inline-flex', 'items-center', 'justify-center', 'gap-2', 'cursor-wait', 'opacity-80'];

    document.addEventListener('submit', function (e) {
      if (e.defaultPrevented) return;
      var btn = e.submitter || e.target.querySelector('[type=submit][data-loading]');
      if (!btn || !btn.hasAttribute('data-loading') || btn.disabled) return;
      btn.dataset.original = btn.innerHTML;
      btn.innerHTML = SPINNER + '<span>' + btn.getAttribute('data-loading') + '</span>';
      btn.classList.add.apply(btn.classList, LOADING_CLASSES);
      btn.setAttribute('aria-busy', 'true');
      btn.disabled = true;
    });

    // Restore buttons when the page comes back from the back/forward cache.
    window.addEventListener('pageshow', function (e) {
      if (!e.persisted) return;
      document.querySelectorAll('[data-loading][aria-busy]').forEach(function (btn) {
        btn.innerHTML = btn.dataset.original;
        btn.classList.remove.apply(btn.classList, LOADING_CLASSES);
        btn.removeAttribute('aria-busy');
        btn.disabled = false;
      });
    });
  })();
</script>
</body>
</html>
